[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldzero-research"
version = "0.3.0"
description = "A reproducible benchmark and typed plugin SDK for causal-law discovery"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
worldzero = "worldzero.cli:main"

# Community packages register exact IDs in [project.entry-points."worldzero.law_families"].

[tool.setuptools.packages.find]
where = ["."]
include = ["worldzero*"]
exclude = ["tests*", "examples*", "runs*", "pilot_evidence*", "evidence*", "build*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
worldzero = ["observatory.html", "laws/official_registry.json"]
