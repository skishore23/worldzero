[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldzero-example-law"
version = "0.1.0"
description = "Minimal community LawFamily example for WorldZero"
requires-python = ">=3.10"
dependencies = ["worldzero-research>=0.3,<0.4"]

[project.entry-points."worldzero.law_families"]
"example_org:preserver" = "worldzero_example_law:family"

[tool.setuptools.packages.find]
where = ["src"]

