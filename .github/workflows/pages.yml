name: Publish browser demo

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'scripts/build_browser_demo.py'
      - 'tests/test_browser_demo.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recording validation dependencies
        run: python -m pip install 'numpy==1.26.4' 'pytest>=8,<9'
      - name: Validate the recorded demo
        run: |
          python -m pytest -q tests/test_browser_demo.py
          node --check demo/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
